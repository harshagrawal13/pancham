name: Pancham
options:
  minimumXcodeGenVersion: "2.40.0"
  bundleIdPrefix: com.harshagrawal
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true

configFiles:
  Debug: Config/Pancham.xcconfig
  Release: Config/Pancham.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    GENERATE_INFOPLIST_FILE: NO
    INFOPLIST_FILE: Pancham/Info.plist
    PRODUCT_BUNDLE_IDENTIFIER: com.harshagrawal.pancham
    PRODUCT_NAME: Pancham
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    COMBINE_HIDPI_IMAGES: YES

schemes:
  Pancham:
    build:
      targets:
        Pancham: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PanchamTests
    profile:
      config: Release
    archive:
      config: Release

targets:
  PanchamTests:
    type: bundle.unit-test
    platform: macOS
    # Sync/ is Foundation-only, so it is tested on its own against a real local backend
    # (server/dev_stack.py) without launching the app.
    sources:
      - path: PanchamTests
      - path: Pancham/Sync
      # The editor's save path (LibraryWorkspace) and what it needs, so it can be tested without a window.
      - path: Pancham/App/LibraryWorkspace.swift
      - path: Pancham/App/Library.swift
      - path: Pancham/App/Preferences.swift
      - path: Pancham/Document/Composition.swift
      - path: Pancham/Document/Taal.swift
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_NAME: PanchamTests
        PRODUCT_MODULE_NAME: PanchamTests
        PRODUCT_BUNDLE_IDENTIFIER: com.harshagrawal.pancham.tests
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: NO
  Pancham:
    type: application
    platform: macOS
    sources:
      - path: Pancham
        excludes:
          - "Resources/Fonts/**"
          - "Resources/Sounds/**"
      - path: Pancham/Resources/Fonts
        type: folder
        buildPhase: resources
      # Bundled SoundFonts (flat in Resources/ for Bundle.url lookup).
      - path: Pancham/Resources/Sounds/vsco-strings.sf2
        buildPhase: resources
      - path: Pancham/Resources/Sounds/vsco-organ.sf2
        buildPhase: resources
      - path: Pancham/Resources/Sounds/tabla.sf2
        buildPhase: resources
      # Bundled tanpura pluck (CC0 — see tanpura-LICENSE.txt) for the riyaz drone.
      - path: Pancham/Resources/Sounds/tanpura.wav
        buildPhase: resources
    resources:
      - Pancham/Assets.xcassets
    entitlements:
      path: Pancham/Pancham.entitlements
      properties:
        # Mic capture must be granted under hardened runtime (release builds);
        # without it the tanpura tuner only hears anything in ad-hoc Debug.
        com.apple.security.device.audio-input: true
